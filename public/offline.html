<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3ec" />
    <title>Offline · Wunderful Life</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, #f3e4d4 0%, transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 80%, #e8ddd0 0%, transparent 50%),
          #f7f3ec;
        color: #3a322c;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.75rem;
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        color: #6b5f55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.8rem 1.4rem;
        font: inherit;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: #f7f3ec;
        background: #3a322c;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then try again to keep browsing Wunderful Life.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      (function () {
        var key = "wl-offline-auto-reload";
        function reloadOnce() {
          try {
            var last = sessionStorage.getItem(key);
            if (last && Date.now() - Number(last) < 15000) return;
            sessionStorage.setItem(key, String(Date.now()));
          } catch (error) {
            // Private mode can block sessionStorage; still try once.
          }
          location.reload();
        }
        if (navigator.onLine) reloadOnce();
        window.addEventListener("online", reloadOnce);
      })();
    </script>
  </body>
</html>
